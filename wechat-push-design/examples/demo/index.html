<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋日茶叙 · 演示推送</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    max-width: 750px;
    margin: 0 auto;
    background: #FAF8F5;
    color: #1A1A1A;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 30px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  .container { padding: 0 32px; }
</style>
</head>
<body>

  <!-- 首屏 -->
  <section class="container" style="padding-top: 96px; padding-bottom: 80px; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -60px; right: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, #8C5B3F 0%, transparent 70%); opacity: .15; pointer-events: none;"></div>
    <span style="font-size: 20px; letter-spacing: 6px; text-transform: uppercase; color: #8C5B3F; font-weight: 600;">AUTUMN TEA JOURNAL</span>
    <h1 style="font-size: 60px; font-weight: 800; line-height: 1.3; letter-spacing: 6px; margin-top: 24px;">秋日茶叙</h1>
    <p style="margin-top: 32px; opacity: .7;">一盏茶的温度，是整个秋天最温柔的仪式。</p>
  </section>

  <!-- 第一章 -->
  <section class="container" style="padding-bottom: 100px;">
    <span style="font-family: Georgia, serif; font-size: 120px; font-weight: 700; color: #8C5B3F; opacity: .12; line-height: 1; display: block;">01</span>
    <h2 style="font-size: 44px; font-weight: 700; letter-spacing: 3px; margin: 16px 0 32px;">一叶知秋</h2>
    <p>秋分过后，山间的茶树开始进入一年中最沉静的时刻。叶片在晨露里缓慢舒展，积蓄了整个夏天的香气，等待一双耐心的手。</p>
  </section>

  <!-- 分隔符 -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 16px; margin: 0 auto 100px;">
    <span style="width: 80px; height: 1px; background: #8C5B3F; opacity: .4;"></span>
    <span style="width: 8px; height: 8px; background: #8C5B3F; transform: rotate(45deg);"></span>
    <span style="width: 80px; height: 1px; background: #8C5B3F; opacity: .4;"></span>
  </div>

  <!-- 引言 -->
  <section class="container" style="padding-bottom: 100px;">
    <blockquote style="position: relative; padding: 40px 48px;">
      <span style="position: absolute; top: 0; left: 0; font-family: Georgia, serif; font-size: 100px; color: #8C5B3F; opacity: .2; line-height: 1;">&ldquo;</span>
      <p style="font-size: 34px; line-height: 1.8; font-weight: 500;">茶之美，在于它从不催促。它只邀请你慢下来。</p>
    </blockquote>
  </section>

  <!-- 数据段 -->
  <section class="container" style="padding-bottom: 120px; text-align: center;">
    <span style="font-family: Georgia, serif; font-size: 96px; font-weight: 700; color: #8C5B3F; line-height: 1;">72<span style="font-size: 48px;">小时</span></span>
    <p style="font-size: 26px; opacity: .55; margin-top: 12px; letter-spacing: 2px;">从采摘到成茶的黄金时间</p>
  </section>

  <!-- 结尾 -->
  <section class="container" style="padding: 80px 32px 120px; text-align: center; background: #F0EAE2;">
    <span style="display: inline-block; padding: 10px 28px; border: 1px solid #8C5B3F; border-radius: 999px; font-size: 24px; color: #8C5B3F; letter-spacing: 2px;">预约品鉴</span>
    <p style="font-size: 34px; font-weight: 600; margin-top: 40px;">这个秋天，与我们对坐饮一杯</p>
    <p style="font-size: 24px; opacity: .5; margin-top: 48px; letter-spacing: 2px;">© 山茶社 · 出品</p>
  </section>

</body>
</html>
